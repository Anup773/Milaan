[project]
name = "milaan-engine"
version = "0.1.0"
description = "Milaan deterministic accounting engine"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["engine*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"